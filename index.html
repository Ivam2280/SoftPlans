<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f8f7f5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SoftPlans" />
    <meta name="description" content="SoftPlans — спокойное место для ваших планов и задач." />
    <title>SoftPlans — список задач</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Навигация" data-i18n-aria="navigation">
        <div class="sidebar-header">
          <a class="brand" href="#" aria-label="SoftPlans — главная" data-i18n-aria="brandLabel">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 32 32" fill="none">
                <path d="M15.7 4.2c2.9 1.8 4.2 4.3 3.6 6.4-.4 1.5-1.8 2.6-3.1 4-1.3-1.4-2.7-2.5-3.1-4-.6-2.1.1-4.6 2.6-6.4Z" fill="#fff" transform="rotate(45 16 16)" />
                <path d="M15.7 4.2c2.9 1.8 4.2 4.3 3.6 6.4-.4 1.5-1.8 2.6-3.1 4-1.3-1.4-2.7-2.5-3.1-4-.6-2.1.1-4.6 2.6-6.4Z" fill="#fff" transform="rotate(135 16 16)" />
                <path d="M15.7 4.2c2.9 1.8 4.2 4.3 3.6 6.4-.4 1.5-1.8 2.6-3.1 4-1.3-1.4-2.7-2.5-3.1-4-.6-2.1.1-4.6 2.6-6.4Z" fill="#fff" transform="rotate(225 16 16)" />
                <path d="M15.7 4.2c2.9 1.8 4.2 4.3 3.6 6.4-.4 1.5-1.8 2.6-3.1 4-1.3-1.4-2.7-2.5-3.1-4-.6-2.1.1-4.6 2.6-6.4Z" fill="#fff" transform="rotate(315 16 16)" />
              </svg>
            </span>
            <span class="brand-text">soft<span class="brand-light">plans</span></span>
          </a>
          <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-expanded="true" aria-controls="group-list">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m14.5 6-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <section class="filter-section" aria-labelledby="filter-heading">
          <h2 class="sidebar-label filter-heading" id="filter-heading" data-i18n="planning">ПЛАНИРОВАНИЕ</h2>
          <nav class="filter-list" id="planning-list" aria-label="Планирование" data-i18n-aria="filterNavigation">
            <span class="nav-glider" id="nav-glider" aria-hidden="true"></span>
            <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">
              <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.7"/><rect x="14" y="4" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.7"/><rect x="4" y="14" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.7"/><rect x="14" y="14" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.7"/></svg></span>
              <span class="filter-label" data-i18n="filterAll">Все</span><span class="filter-count" data-count="all">0</span>
            </button>
            <button class="filter-button" type="button" data-filter="today" aria-pressed="false">
              <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5.5" width="16" height="15" rx="2.5" stroke="currentColor" stroke-width="1.7"/><path d="M8 3.5v4M16 3.5v4M4 10h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>
              <span class="filter-label" data-i18n="filterToday">Сегодня</span><span class="filter-count" data-count="today">0</span>
            </button>
            <button class="filter-button" type="button" data-filter="scheduled" aria-pressed="false">
              <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/><path d="M12 7v5l3.2 2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
              <span class="filter-label" data-i18n="filterScheduled" data-i18n-mobile="filterScheduledShort">Запланировано</span><span class="filter-count" data-count="scheduled">0</span>
            </button>
            <button class="filter-button" type="button" data-filter="favorites" aria-pressed="false">
              <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M5 21V4h13l-2.5 4.5L18 13H5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
              <span class="filter-label" data-i18n="filterFavorites">Важное</span><span class="filter-count" data-count="favorites">0</span>
            </button>
            <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">
              <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M20 11.1V12a8 8 0 1 1-4.7-7.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="m9 11.5 3 3L20.5 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
              <span class="filter-label" data-i18n="filterCompleted">Выполнено</span><span class="filter-count" data-count="completed">0</span>
            </button>
          </nav>
        </section>

        <section class="groups-section" id="groups-section" aria-labelledby="groups-heading">
          <div class="groups-heading-row">
            <h2 class="sidebar-label groups-heading" id="groups-heading" data-i18n="groupsHeading">МОИ ГРУППЫ</h2>
            <button class="add-group-button" id="open-group-dialog" type="button" aria-label="Добавить группу" title="Добавить группу" data-i18n-aria="addGroup" data-i18n-title="addGroup">
              <span class="add-group-plus" aria-hidden="true">+</span>
              <svg class="add-group-done" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m5 12.5 4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
            <button class="empty-groups-hint" id="empty-groups-hint" type="button" data-i18n="createGroupButton" hidden>Создать группу</button>
          </div>
          <nav class="group-list" id="group-list" aria-label="Пользовательские группы" data-i18n-aria="groupsNavigation"></nav>
        </section>
      </aside>

      <main class="main-content">
        <header class="topbar">
          
          <div class="search-box desktop-search-box" id="desktop-search-box">
            <button
              class="search-toggle"
              id="desktop-search-toggle"
              type="button"
              aria-expanded="false"
              aria-controls="desktop-search-input"
              aria-label="Поиск по задачам"
              title="Поиск по задачам"
              data-i18n-aria="searchLabel"
              data-i18n-title="searchLabel"
            >
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8" />
                <path d="m16 16 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
            </button>
            <input class="search-input" id="desktop-search-input" type="search" maxlength="80" autocomplete="off" placeholder="Поиск задач..." aria-label="Поиск по задачам" data-i18n-placeholder="searchPlaceholder" data-i18n-aria="searchLabel" />
            <button class="search-clear" id="desktop-search-clear" type="button" aria-label="Очистить поиск" data-i18n-aria="clearSearch" hidden>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>
            </button>
          </div>

          <div class="topbar-actions">
            
            <div class="lang-dropdown" id="lang-dropdown">
              <button
                class="lang-dropdown-trigger"
                id="lang-dropdown-trigger"
                type="button"
                aria-haspopup="listbox"
                aria-expanded="false"
                aria-label="Язык интерфейса"
                data-i18n-aria="languageLabel"
              >
                <span id="lang-dropdown-label">РУ</span>
                <svg class="lang-dropdown-chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
              <div class="lang-dropdown-menu" id="lang-dropdown-menu" role="listbox" aria-label="Язык интерфейса" data-i18n-aria="languageLabel" hidden>
                <button class="lang-dropdown-option" type="button" role="option" data-lang="uk">
                  <span>УКР</span>
                  <svg class="lang-check" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m3.5 8.5 3 3 6-6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <button class="lang-dropdown-option" type="button" role="option" data-lang="ru">
                  <span>РУ</span>
                  <svg class="lang-check" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m3.5 8.5 3 3 6-6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <button class="lang-dropdown-option" type="button" role="option" data-lang="en">
                  <span>EN</span>
                  <svg class="lang-check" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m3.5 8.5 3 3 6-6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
              </div>
            </div>

            
            <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">
              <span class="theme-switch-track" aria-hidden="true">
                <span class="theme-track-icon theme-track-sun">
                  <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.7" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2M12 19.5v2M4.8 4.8l1.4 1.4m11.6 11.6 1.4 1.4M2.5 12h2m15 0h2M4.8 19.2l1.4-1.4M17.8 6.2l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                </span>
                <span class="theme-track-icon theme-track-moon">
                  <svg viewBox="0 0 24 24" fill="none"><path d="M19.4 15.2A8.2 8.2 0 0 1 8.8 4.6 8.5 8.5 0 1 0 19.4 15.2Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
                <span class="theme-switch-knob"></span>
              </span>
            </button>
          </div>
        </header>

        <section class="tasks-section" aria-labelledby="tasks-heading">
          
          <div class="mobile-prefs-backdrop" id="mobile-prefs-backdrop" hidden></div>

          <div class="mobile-sticky-header" id="mobile-sticky-header">
            
            <div class="section-heading" id="section-heading">
              <h2 id="tasks-heading"><span class="tasks-title">Мои задачи</span> <span class="heading-count" id="heading-count">0</span></h2>
              <div class="heading-tools">
                <div class="search-box mobile-search-box" id="search-box">
                  <button
                    class="search-toggle"
                    id="search-toggle"
                    type="button"
                    aria-expanded="false"
                    aria-controls="search-input"
                    aria-label="Поиск по задачам"
                    title="Поиск по задачам"
                    data-i18n-aria="searchLabel"
                    data-i18n-title="searchLabel"
                  >
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                      <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8" />
                      <path d="m16 16 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                    </svg>
                  </button>
                  <input class="search-input" id="search-input" type="search" maxlength="80" autocomplete="off" placeholder="Поиск задач..." aria-label="Поиск по задачам" data-i18n-placeholder="searchPlaceholder" data-i18n-aria="searchLabel" />
                  <button class="search-clear" id="search-clear" type="button" aria-label="Очистить поиск" data-i18n-aria="clearSearch" hidden>
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>
                  </button>
                </div>

                <div class="mobile-prefs" id="mobile-prefs">
                  <button
                    class="mobile-prefs-trigger"
                    id="mobile-prefs-trigger"
                    type="button"
                    aria-expanded="false"
                    aria-controls="mobile-prefs-popover"
                    aria-label="Язык интерфейса"
                    data-i18n-aria="languageLabel"
                  >
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                      <circle cx="5" cy="12" r="1.7" fill="currentColor" />
                      <circle cx="12" cy="12" r="1.7" fill="currentColor" />
                      <circle cx="19" cy="12" r="1.7" fill="currentColor" />
                    </svg>
                  </button>

                  
                  <div class="mobile-prefs-popover" id="mobile-prefs-popover" hidden>
                    <div class="mobile-prefs-langs" id="mobile-prefs-langs" role="group" aria-label="Язык интерфейса" data-i18n-aria="languageLabel">
                      <span class="seg-glider" id="lang-seg-glider" aria-hidden="true"></span>
                      <button class="mobile-pref-lang" type="button" data-lang="uk">УКР</button>
                      <button class="mobile-pref-lang" type="button" data-lang="ru">РУ</button>
                      <button class="mobile-pref-lang" type="button" data-lang="en">EN</button>
                    </div>
                    <div class="mobile-prefs-themes" id="mobile-prefs-themes" role="group" aria-label="Тема оформления" data-i18n-aria="themeLabel">
                      <span class="seg-glider" id="theme-seg-glider" aria-hidden="true"></span>
                      <button class="mobile-pref-theme-seg" type="button" data-theme-val="light">
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3.7" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2M12 19.5v2M4.8 4.8l1.4 1.4m11.6 11.6 1.4 1.4M2.5 12h2m15 0h2M4.8 19.2l1.4-1.4M17.8 6.2l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                        <span data-i18n="themeLightName">Светлая</span>
                      </button>
                      <button class="mobile-pref-theme-seg" type="button" data-theme-val="dark">
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19.4 15.2A8.2 8.2 0 0 1 8.8 4.6 8.5 8.5 0 1 0 19.4 15.2Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        <span data-i18n="themeDarkName">Тёмная</span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            
            <div class="mobile-groups-slot" id="mobile-groups-slot"></div>
          </div>

          <div class="mobile-composer-backdrop" id="mobile-composer-backdrop" hidden></div>

          <form class="task-form" id="task-form">
            <label class="visually-hidden" for="task-input" data-i18n="newTask">Новая задача</label>
            <input id="task-input" name="task" type="text" maxlength="160" placeholder="Добавить новую задачу..." data-i18n-placeholder="placeholder" autocomplete="off" required />
            <div class="task-schedule-controls">
              <label class="visually-hidden" for="task-date" id="task-date-label" data-i18n="taskDate">Дата задачи</label>
              <button class="task-schedule-control" id="task-date-control" type="button" aria-labelledby="task-date-label" aria-haspopup="dialog">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="5.5" width="16" height="15" rx="2.5" stroke="currentColor" stroke-width="1.7"/><path d="M8 3.5v4M16 3.5v4M4 10h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                <span class="task-schedule-value" id="task-date-display" aria-hidden="true"></span>
              </button>
              <input class="task-picker-input" id="task-date" name="taskDate" type="hidden" />
              <label class="visually-hidden" for="task-time" id="task-time-label" data-i18n="taskTime">Время</label>
              <button class="task-schedule-control" id="task-time-control" type="button" aria-labelledby="task-time-label" aria-haspopup="dialog">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/><path d="M12 7v5l3.2 2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span class="task-schedule-value" id="task-time-display" aria-hidden="true"></span>
              </button>
              <input class="task-picker-input" id="task-time" name="taskTime" type="hidden" />
            </div>
            <button
              class="clear-schedule-button"
              id="clear-task-schedule"
              type="button"
              aria-label="Очистить"
              title="Очистить"
              data-i18n-aria="clearTaskSchedule"
              data-i18n-title="clearTaskSchedule"
              disabled
            >
              <span class="clear-schedule-label" data-i18n="clearTaskSchedule">Очистить</span>
            </button>
            <button class="add-button" type="submit"><span class="add-label" data-i18n="add">Добавить</span><svg class="button-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
          </form>

          <button
            class="mobile-fab"
            id="mobile-fab"
            type="button"
            aria-expanded="false"
            aria-controls="task-form"
            aria-label="Новая задача"
            title="Новая задача"
            data-i18n-aria="newTask"
            data-i18n-title="newTask"
          >
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
            </svg>
          </button>

          <ul class="task-list" id="task-list" aria-live="polite"></ul>
          <div class="empty-state" id="empty-state" hidden>
            <div class="empty-illustration" aria-hidden="true">
              <span class="empty-sun"></span>
              <span class="empty-paper"><span></span><span></span><span></span></span>
              <span class="empty-spark">✦</span>
            </div>
            <h3 id="empty-title"></h3>
            <p id="empty-copy"></p>
          </div>
        </section>
      </main>
    </div>

    
    <dialog class="group-dialog confirm-dialog" id="confirm-clear-dialog" aria-labelledby="confirm-clear-title">
      <form class="group-dialog-form" id="confirm-clear-form" method="dialog">
        <button class="dialog-close" id="close-confirm-clear" type="button" aria-label="Закрыть" data-i18n-aria="closeDialog">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
        <h2 id="confirm-clear-title" data-i18n="confirmClearTitle">Очистить выполненные?</h2>
        <p class="confirm-dialog-copy" id="confirm-clear-copy" data-i18n="confirmClearCopy">Все завершённые задачи будут безвозвратно удалены из списка.</p>
        <div class="dialog-dual-actions">
          <button class="dialog-secondary-btn" id="cancel-confirm-clear" type="button" autofocus data-i18n="cancelTaskButton">Отмена</button>
          <button class="dialog-primary-btn danger-submit" id="confirm-clear-submit" type="submit" data-i18n="clearCompleted">Очистить выполненные</button>
        </div>
      </form>
    </dialog>

    <dialog class="group-dialog" id="group-dialog" aria-labelledby="group-dialog-title">
      <form class="group-dialog-form" id="group-form">
        <button class="dialog-close" id="close-group-dialog" type="button" aria-label="Закрыть" data-i18n-aria="closeDialog">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
        <h2 id="group-dialog-title">Создать группу</h2>
        <label class="group-name-label visually-hidden" for="group-name" data-i18n="groupNameLabel">Название группы</label>
        <input class="group-name-input" id="group-name" name="groupName" maxlength="32" placeholder="Название группы" data-i18n-placeholder="groupNameLabel" required autocomplete="off" />
        <fieldset class="color-fieldset">
          <div class="color-options" id="color-options"></div>
        </fieldset>
        <button class="add-button group-submit" type="submit">+ Добавить</button>
      </form>
    </dialog>

    <dialog class="group-dialog" id="task-edit-dialog" aria-labelledby="task-edit-title">
      <form class="group-dialog-form" id="task-edit-form">
        <button class="dialog-close" id="close-task-edit-dialog" type="button" aria-label="Закрыть" data-i18n-aria="closeDialog">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
        <h2 id="task-edit-title" data-i18n="editTaskTitle">Редактировать задачу</h2>
        <label class="group-name-label" for="task-edit-input" data-i18n="editTaskLabel">Название задачи</label>
        <input class="group-name-input" id="task-edit-input" name="taskText" maxlength="160" required autocomplete="off" />

        <div class="task-edit-schedule-grid">
          <div class="task-edit-field">
            <span class="group-name-label" data-i18n="taskDate">Дата задачи</span>
            <button class="custom-picker-trigger" id="task-edit-date-trigger" type="button" aria-haspopup="dialog">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="5.5" width="16" height="15" rx="2.5" stroke="currentColor" stroke-width="1.7"/><path d="M8 3.5v4M16 3.5v4M4 10h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
              <span class="custom-picker-trigger-text" id="task-edit-date-display"></span>
            </button>
            <input id="task-edit-date" name="taskDate" type="hidden" />
          </div>

          <div class="task-edit-field">
            <span class="group-name-label" data-i18n="taskTime">Время</span>
            <button class="custom-picker-trigger" id="task-edit-time-trigger" type="button" aria-haspopup="dialog">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/><path d="M12 7v5l3.2 2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span class="custom-picker-trigger-text" id="task-edit-time-display"></span>
            </button>
            <input id="task-edit-time" name="taskTime" type="hidden" />
          </div>
        </div>

        <div class="task-edit-field" id="task-edit-group-field">
          <span class="group-name-label" data-i18n="groupTag">Группа</span>
          <div class="task-edit-group-list" id="task-edit-group-list" role="radiogroup" aria-label="Группа" data-i18n-aria="groupTag"></div>
          <input id="task-edit-group" name="taskGroup" type="hidden" />
        </div>

        <div class="dialog-dual-actions">
          <button class="dialog-secondary-btn" id="cancel-task-edit" type="button" data-i18n="cancelTaskButton">Отмена</button>
          <button class="dialog-primary-btn" id="save-task-edit" type="submit" data-i18n="saveTaskButton">Сохранить</button>
        </div>
      </form>
    </dialog>

    
    <div class="dt-popover" id="datetime-popover" role="dialog" aria-modal="true" hidden>
      <div class="dt-backdrop" id="dt-backdrop"></div>
      <div class="dt-card" id="dt-card">
        <div class="dt-view" id="dt-date-view" hidden>
          <div class="dt-quick-row dt-date-quick-row" id="dt-date-presets"></div>
          <div class="dt-cal-header">
            <button class="dt-nav-btn" id="dt-prev-month" type="button" aria-label="Предыдущий месяц">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m15 6-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="dt-month-title" id="dt-month-title"></div>
            <button class="dt-nav-btn" id="dt-next-month" type="button" aria-label="Следующий месяц">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div class="dt-weekdays" id="dt-weekdays"></div>
          <div class="dt-days-grid" id="dt-days-grid"></div>
        </div>

        <div class="dt-view" id="dt-time-view" hidden>
          <div class="dt-time-input-wrap">
            <input
              class="dt-time-input"
              id="dt-time-input"
              type="text"
              inputmode="numeric"
              maxlength="5"
              placeholder="09:00"
              autocomplete="off"
              aria-label="Время"
              data-i18n-aria="taskTime"
            />
          </div>
          <div class="dt-quick-row dt-time-quick-row" id="dt-time-presets"></div>
          <div class="dt-wheels">
            <div class="dt-wheel-col">
              <div class="dt-wheel" id="dt-hours-wheel" role="listbox" aria-label="Часы"></div>
            </div>
            <div class="dt-wheel-sep">:</div>
            <div class="dt-wheel-col">
              <div class="dt-wheel" id="dt-minutes-wheel" role="listbox" aria-label="Минуты"></div>
            </div>
          </div>
        </div>

        <div class="dialog-dual-actions dt-footer">
          <button class="dialog-secondary-btn dt-clear-btn" id="dt-clear-btn" type="button" data-i18n="clearTaskSchedule">Очистить</button>
          <button class="dialog-primary-btn dt-apply-btn" id="dt-apply-btn" type="button" data-i18n="saveTaskButton">Сохранить</button>
        </div>
      </div>
    </div>

    <div class="group-context-menu" id="group-context-menu" role="menu" hidden>
      <button class="group-context-action task-context-edit" id="edit-group-action" type="button" role="menuitem" data-i18n="editGroup">Редактировать группу</button>
      <button class="group-context-action task-context-edit" id="reorder-groups-action" type="button" role="menuitem" data-i18n="reorderGroups">Изменить порядок</button>
      <button class="group-context-action" id="delete-group-action" type="button" role="menuitem" data-i18n="deleteGroup">Удалить группу</button>
    </div>
    <div class="group-context-menu" id="task-context-menu" role="menu" hidden>
      <button class="group-context-action task-context-edit" id="edit-task-action" type="button" role="menuitem" data-i18n="editTask">Редактировать задачу</button>
      <button class="group-context-action" id="delete-task-action" type="button" role="menuitem" data-i18n="deleteTask">Удалить задачу</button>
    </div>
  </body>
</html>
